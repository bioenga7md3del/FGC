<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إجازات الموقع — FGC System</title>
  <link rel="icon" href="FGC.jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/core.js"></script>
</head>
<body>
<div id="pageLoader" class="page-loader"><div class="spinner"></div></div>
<header id="appHeader"></header>

<main class="page">
  <div class="print-only print-head"><img src="FGC.jpeg" alt=""><h2>خطة إجازات موظفي الموقع</h2><div></div></div>

  <div class="page-head">
    <div>
      <div class="breadcrumb no-print" id="crumb"></div>
      <h1 class="js-site-name">...</h1>
      <p>خطة إجازات موظفي الموقع وطلباتهم</p>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
      <button class="btn btn-secondary" onclick="exportCSV()"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
      <button class="btn btn-primary" data-edit hidden onclick="openVac()"><i class="fa-solid fa-plane-departure"></i> طلب إجازة</button>
    </div>
  </div>

  <nav id="siteTabs"></nav>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="toolbar">
      <div class="field grow"><label>بحث بالاسم / الرقم الوظيفي</label><div class="input-icon"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="fSearch" placeholder="بحث سريع..."></div></div>
      <div class="field"><label>الحالة</label>
        <select class="select" id="fStatus"><option value="all">الكل</option><option value="pending">قيد المراجعة</option><option value="suggested">موعد مقترح (يحتاج رد)</option><option value="approved">معتمد</option><option value="rejected">مرفوض</option></select>
      </div>
    </div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th style="width:40px" class="col-actions"></th><th>الموظف</th><th>الرقم الوظيفي</th><th>البداية</th><th>النهاية</th><th class="center">الأيام</th><th>البديل</th><th>الحالة</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8"><div class="skeleton"></div></td></tr></tbody>
    </table></div>
  </div>
</main>

<div class="modal" id="vacModal">
  <div class="modal__dialog lg">
    <div class="modal__head"><div><h3 id="vacTitle">طلب إجازة جديد</h3></div><button class="btn btn-ghost btn-icon" data-close><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal__body">
      <input type="hidden" id="vId">
      <div class="form-grid">
        <div class="field"><label class="req">اسم الموظف</label><input class="input" id="vName"></div>
        <div class="field"><label class="req">الرقم الوظيفي</label><input class="input" id="vEmpId" inputmode="numeric"></div>
        <div class="field"><label class="req">المسمى الوظيفي</label><select class="select" id="vJob"></select></div>
        <div class="field"><label>رصيد الإجازات المتاح (يوم)</label><input type="number" class="input" id="vBalance" min="0"></div>
        <div class="field"><label>تاريخ آخر إجازة</label><input type="date" class="input" id="vLast"></div>
        <div class="field"><label>الموظف البديل</label><select class="select" id="vCover"></select></div>
      </div>
      <fieldset class="fieldset"><legend>فترة الإجازة</legend>
        <div class="form-grid-3">
          <div class="field"><label class="req">من</label><input type="date" class="input" id="vStart"></div>
          <div class="field"><label class="req">إلى</label><input type="date" class="input" id="vEnd"></div>
          <div class="field"><label>عدد الأيام</label><input class="input" id="vDays" readonly></div>
        </div>
        <div class="callout callout-warning" id="vBalanceWarn" hidden style="margin-top:10px"><i class="fa-solid fa-triangle-exclamation"></i><div>عدد أيام الإجازة أكبر من الرصيد المتاح.</div></div>
      </fieldset>
    </div>
    <div class="modal__foot"><button class="btn btn-secondary" data-close>إلغاء</button><button class="btn btn-primary" onclick="saveVac(this)">حفظ الطلب</button></div>
  </div>
</div>

<script>
  const { db, firebase, esc, toast, openModal, closeModal, confirmDialog, withButton, vacBadge, VAC_STATUS, daysBetween, todayStr, tsMillis } = FGC;
  const JOBS = ['مدير الموقع', 'مهندس (س)', 'مهندس (ج)', 'فني (س)', 'فني (ج)'];
  let ctx, siteId, siteName = '', vacs = [], altEmps = [], openRows = new Set();

  FGC.init({ site: true, tab: 'vacations', nav: 'site' }).then(c => {
    ctx = c; siteId = c.siteId;
    FGC.$$('[data-edit]').forEach(e => e.hidden = !ctx.can.edit);
    document.querySelector('.print-head div').innerHTML = `<b class="js-site-name"></b> — ${todayStr()}`;

    db.collection('budgets').doc(siteId).onSnapshot(d => {
      if (!d.exists) return;
      siteName = d.data().itemName || '';
      FGC.$$('.js-site-name').forEach(e => e.textContent = siteName);
      document.title = `${siteName} — الإجازات`;
      document.getElementById('crumb').innerHTML = ctx.can.admin ? `<a href="dashboard.html">لوحة التحكم</a><i class="fa-solid fa-chevron-left" style="font-size:10px"></i><a href="vacations.html">الإجازات المركزية</a>` : '';
    });
    db.collection('alternative_employees').onSnapshot(s => { altEmps = s.docs.map(d => d.data().name).filter(Boolean).sort((a, b) => a.localeCompare(b, 'ar')); },
      () => { altEmps = []; });
    db.collection('vacations').where('siteId', '==', siteId).onSnapshot(s => {
      vacs = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => tsMillis(b.createdAt) - tsMillis(a.createdAt));
      render();
    }, err => toast(FGC.errMsg(err), 'error'));
  });

  ['fSearch', 'fStatus'].forEach(id => document.getElementById(id).addEventListener('input', render));

  function filtered() {
    const q = document.getElementById('fSearch').value.trim().toLowerCase();
    const st = document.getElementById('fStatus').value;
    return vacs.filter(v => (st === 'all' || (v.status || 'pending') === st) && (!q || `${v.empName} ${v.empId}`.toLowerCase().includes(q)));
  }

  function render() {
    const count = s => vacs.filter(v => (v.status || 'pending') === s).length;
    const cur = document.getElementById('fStatus').value;
    const k = (key, label, icon, cls, n) => `<button class="kpi ${cls} ${cur === key ? 'is-active' : ''}" data-filter="${key}"><div class="kpi__label"><span class="kpi__icon"><i class="fa-solid ${icon}"></i></span>${label}</div><div class="kpi__value">${n}</div></button>`;
    document.getElementById('kpis').innerHTML =
      k('all', 'كل الطلبات', 'fa-list', '', vacs.length) +
      k('pending', 'قيد المراجعة', 'fa-hourglass-half', 'kpi--warning', count('pending')) +
      k('suggested', 'مواعيد مقترحة', 'fa-calendar-plus', 'kpi--info', count('suggested')) +
      k('approved', 'معتمد', 'fa-circle-check', 'kpi--success', count('approved'));

    const list = filtered();
    document.getElementById('rows').innerHTML = list.map(v => {
      const open = openRows.has(v.id);
      const st = v.status || 'pending';
      const suggestion = st === 'suggested' ? `
        <div class="callout callout-info full" style="align-items:center">
          <i class="fa-solid fa-calendar-plus"></i>
          <div style="flex:1">الإدارة اقترحت موعداً بديلاً: من <b>${esc(v.suggestedStart)}</b> إلى <b>${esc(v.suggestedEnd)}</b></div>
          ${ctx.can.edit ? `<button class="btn btn-success btn-sm" data-act="accept" data-id="${esc(v.id)}"><i class="fa-solid fa-check"></i> قبول</button>
          <button class="btn btn-danger-soft btn-sm" data-act="reject" data-id="${esc(v.id)}"><i class="fa-solid fa-xmark"></i> رفض</button>` : ''}
        </div>` : '';
      const btns = [];
      if (ctx.can.edit && (st === 'pending' || st === 'rejected')) btns.push(`<button class="btn btn-secondary btn-sm" data-act="edit" data-id="${esc(v.id)}"><i class="fa-regular fa-pen-to-square"></i> ${st === 'rejected' ? 'تعديل وإعادة تقديم' : 'تعديل الطلب'}</button>`);
      if (ctx.can.admin) btns.push(`<button class="btn btn-danger-soft btn-sm" data-act="delete" data-id="${esc(v.id)}"><i class="fa-regular fa-trash-can"></i> حذف</button>`);
      return `
      <tr class="${open ? 'is-open' : ''}" style="cursor:pointer" data-act="toggle" data-id="${esc(v.id)}">
        <td class="col-actions"><i class="fa-solid fa-chevron-down chev muted"></i></td>
        <td><div class="cell-title">${esc(v.empName)}</div><div class="cell-sub">${esc(v.jobTitle || '—')}</div></td>
        <td>${esc(v.empId)}</td>
        <td class="fw-600">${esc(v.startDate)}</td><td class="fw-600">${esc(v.endDate)}</td>
        <td class="center">${esc(v.reqDays)}</td>
        <td>${esc(v.coverEmp || '—')}</td>
        <td>${vacBadge(st)}</td>
      </tr>
      <tr class="expand-row" ${open ? '' : 'hidden'}><td colspan="8"><div class="detail-grid">
        <div class="item"><span>الرصيد المتاح</span><strong>${esc(v.balance || 0)} يوم</strong></div>
        <div class="item"><span>آخر إجازة</span><strong>${esc(v.lastVacation || 'لا يوجد')}</strong></div>
        <div class="item"><span>تاريخ الطلب</span><strong>${v.createdAt ? esc(FGC.toISODate(new Date(tsMillis(v.createdAt)))) : '—'}</strong></div>
        <div class="item full"><span>ملاحظات الإدارة</span><strong>${esc(v.notes || 'لا توجد ملاحظات')}</strong></div>
        ${suggestion}
        ${btns.length ? `<div class="full actions">${btns.join('')}</div>` : ''}
      </div></td></tr>`;
    }).join('') || `<tr><td colspan="8"><div class="empty"><i class="fa-solid fa-umbrella-beach"></i><h4>${vacs.length ? 'لا توجد نتائج مطابقة' : 'لا توجد طلبات إجازة بعد'}</h4></div></td></tr>`;
  }

  document.getElementById('kpis').addEventListener('click', e => {
    const b = e.target.closest('[data-filter]'); if (!b) return;
    document.getElementById('fStatus').value = b.dataset.filter; render();
  });
  document.getElementById('rows').addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const id = el.dataset.id, act = el.dataset.act;
    if (act === 'toggle') { openRows.has(id) ? openRows.delete(id) : openRows.add(id); render(); return; }
    e.stopPropagation();
    if (act === 'edit') openVac(id);
    if (act === 'delete') delVac(id);
    if (act === 'accept' || act === 'reject') respond(id, act);
  });

  // ---------- Form ----------
  const F = id => document.getElementById(id);
  function fillSelect(sel, options, value, empty) {
    const opts = [...options]; if (value && !opts.includes(value)) opts.unshift(value);
    sel.innerHTML = (empty ? `<option value="">${empty}</option>` : '') + opts.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
    sel.value = value || '';
    if (!empty && !value) sel.selectedIndex = 0;
  }
  function calcDays() {
    const s = F('vStart').value, e = F('vEnd').value;
    const d = s && e ? daysBetween(s, e) : 0;
    F('vDays').value = d > 0 ? d : '';
    F('vBalanceWarn').hidden = !(d > 0 && F('vBalance').value !== '' && d > Number(F('vBalance').value));
  }
  ['vStart', 'vEnd', 'vBalance'].forEach(id => F(id).addEventListener('input', calcDays));

  function openVac(id) {
    const v = vacs.find(x => x.id === id) || {};
    F('vacTitle').textContent = id ? 'تعديل طلب الإجازة' : 'طلب إجازة جديد';
    F('vId').value = id || '';
    F('vName').value = v.empName || ''; F('vEmpId').value = v.empId || '';
    fillSelect(F('vJob'), JOBS, v.jobTitle);
    F('vBalance').value = v.balance ?? ''; F('vLast').value = v.lastVacation || '';
    fillSelect(F('vCover'), altEmps, v.coverEmp, '— يحدد لاحقاً —');
    F('vStart').value = v.startDate || ''; F('vEnd').value = v.endDate || '';
    F('vStart').min = todayStr(); F('vEnd').min = todayStr();
    calcDays();
    openModal('vacModal');
  }

  function saveVac(btn) {
    const id = F('vId').value, start = F('vStart').value, end = F('vEnd').value;
    const data = {
      siteId, empName: F('vName').value.trim(), empId: F('vEmpId').value.trim(), jobTitle: F('vJob').value,
      balance: Number(F('vBalance').value) || 0, lastVacation: F('vLast').value, coverEmp: F('vCover').value,
      startDate: start, endDate: end, reqDays: daysBetween(start, end), status: 'pending', notes: ''
    };
    if (!data.empName || !data.empId) return toast('اكتب اسم الموظف ورقمه الوظيفي.', 'warning');
    if (!start || !end) return toast('حدد بداية ونهاية الإجازة.', 'warning');
    if (start < todayStr()) return toast('لا يمكن تقديم طلب بتاريخ ماضي.', 'warning');
    if (end < start) return toast('تاريخ النهاية يجب أن يكون بعد البداية.', 'warning');
    withButton(btn, async () => {
      if (id) {
        data.suggestedStart = firebase.firestore.FieldValue.delete();
        data.suggestedEnd = firebase.firestore.FieldValue.delete();
        await db.collection('vacations').doc(id).update(data);
      } else {
        data.createdAt = new Date().toISOString();
        await db.collection('vacations').add(data);
      }
      closeModal('vacModal'); toast(id ? 'تم تحديث الطلب وإعادة تقديمه' : 'تم تقديم الطلب');
    });
  }

  async function respond(id, action) {
    const v = vacs.find(x => x.id === id); if (!v) return;
    const accept = action === 'accept';
    if (!(await confirmDialog(accept ? `قبول الموعد المقترح (${v.suggestedStart} ← ${v.suggestedEnd}) واعتماد الإجازة؟` : 'رفض الموعد المقترح؟', { title: accept ? 'قبول الموعد' : 'رفض الموعد', confirmText: accept ? 'قبول' : 'رفض', danger: !accept }))) return;
    try {
      const del = firebase.firestore.FieldValue.delete();
      await db.collection('vacations').doc(id).update(accept
        ? { startDate: v.suggestedStart, endDate: v.suggestedEnd, reqDays: daysBetween(v.suggestedStart, v.suggestedEnd), status: 'approved', suggestedStart: del, suggestedEnd: del, notes: 'تم قبول الموعد المقترح واعتماده.' }
        : { status: 'rejected', suggestedStart: del, suggestedEnd: del, notes: 'تم رفض الموعد المقترح من الموظف.' });
      toast(accept ? 'تم اعتماد الإجازة' : 'تم رفض الموعد المقترح');
    } catch (e) { toast(FGC.errMsg(e), 'error'); }
  }

  async function delVac(id) {
    const v = vacs.find(x => x.id === id);
    if (!(await confirmDialog(`حذف طلب إجازة ${v ? v.empName : ''} نهائياً؟`, { title: 'حذف الطلب', confirmText: 'حذف', danger: true }))) return;
    try { await db.collection('vacations').doc(id).delete(); toast('تم حذف الطلب'); } catch (e) { toast(FGC.errMsg(e), 'error'); }
  }

  function exportCSV() {
    FGC.downloadCSV(`إجازات_${siteName}_${todayStr()}.csv`,
      ['الرقم الوظيفي', 'اسم الموظف', 'المسمى الوظيفي', 'آخر إجازة', 'الرصيد', 'البداية', 'النهاية', 'الأيام', 'البديل', 'الحالة', 'ملاحظات'],
      filtered().map(v => [v.empId, v.empName, v.jobTitle, v.lastVacation, v.balance || 0, v.startDate, v.endDate, v.reqDays, v.coverEmp, (VAC_STATUS[v.status] || VAC_STATUS.pending).label, v.notes]));
  }
</script>
</body>
</html>
