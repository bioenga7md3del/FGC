<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أجهزة القياس والمعايرة — FGC System</title>
  <link rel="icon" href="FGC.jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/core.js"></script>
</head>
<body>
<div id="pageLoader" class="page-loader"><div class="spinner"></div></div>
<header id="appHeader"></header>

<main class="page">
  <div class="print-only print-head"><img src="FGC.jpeg" alt=""><h2>متابعة أجهزة القياس والمعايرة</h2><div><b class="js-site-name"></b> — <span id="printDate"></span></div></div>

  <div class="page-head">
    <div>
      <div class="breadcrumb no-print" id="crumb"></div>
      <h1 class="js-site-name">...</h1>
      <p>أجهزة القياس ومواعيد انتهاء المعايرة</p>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
      <button class="btn btn-secondary" onclick="exportCSV()"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
      <button class="btn btn-primary" data-edit hidden onclick="openDevice()"><i class="fa-solid fa-plus"></i> إضافة جهاز</button>
    </div>
  </div>

  <nav id="siteTabs"></nav>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="toolbar">
      <div class="field grow"><label>بحث بالاسم / الرقم التسلسلي / الشركة / القسم</label><div class="input-icon"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="fSearch" placeholder="اكتب للبحث..."></div></div>
      <div class="field"><label>حالة الجهاز</label><select class="select" id="fStatus"><option value="all">الكل</option><option value="active">في الخدمة</option><option value="inactive">خارج الخدمة / تكهين</option></select></div>
    </div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>الجهاز</th><th>الشركة</th><th>الرقم التسلسلي</th><th>القسم</th><th>آخر معايرة</th><th>انتهاء المعايرة</th><th class="center">الأيام المتبقية</th><th>الحالة</th><th>ملاحظات</th><th class="col-actions" data-edit hidden></th></tr></thead>
      <tbody id="rows"><tr><td colspan="10"><div class="skeleton"></div></td></tr></tbody>
    </table></div>
  </div>
</main>

<div class="modal" id="devModal"><div class="modal__dialog lg">
  <div class="modal__head"><div><h3 id="devTitle">إضافة جهاز قياس</h3></div><button class="btn btn-ghost btn-icon" data-close><i class="fa-solid fa-xmark"></i></button></div>
  <div class="modal__body"><input type="hidden" id="dId">
    <div class="form-grid">
      <div class="field span-2"><label class="req">اسم الجهاز / نوعه</label>
        <div class="row" style="flex-wrap:nowrap"><select class="select" id="dName"></select><button class="btn btn-secondary" id="addTypeBtn" data-admin hidden onclick="addType()" title="إضافة نوع جديد للقائمة"><i class="fa-solid fa-plus"></i> نوع جديد</button></div>
      </div>
      <div class="field"><label class="req">الشركة المصنعة</label><input class="input" id="dBrand"></div>
      <div class="field"><label class="req">الرقم التسلسلي (S/N)</label><input class="input mono ltr" id="dSN"><span class="hint text-danger" id="snWarn" hidden>هذا الرقم التسلسلي مسجل لجهاز آخر في الموقع.</span></div>
      <div class="field"><label>القسم / الموقع داخل المستشفى</label><input class="input" id="dLoc"></div>
      <div class="field"><label>حالة الجهاز</label><select class="select" id="dStatus"><option value="active">في الخدمة</option><option value="inactive">خارج الخدمة / تكهين</option></select></div>
      <div class="field"><label class="req">تاريخ آخر معايرة</label><input type="date" class="input" id="dCal"></div>
      <div class="field"><label class="req">تاريخ انتهاء المعايرة</label><input type="date" class="input" id="dExp"><span class="hint">يُحسب تلقائياً بعد سنة ويمكن تعديله.</span></div>
      <div class="field span-2"><label>ملاحظات</label><input class="input" id="dNotes"></div>
    </div></div>
  <div class="modal__foot"><button class="btn btn-secondary" data-close>إلغاء</button><button class="btn btn-primary" onclick="saveDevice(this)">حفظ</button></div>
</div></div>

<script>
  const { db, esc, toast, openModal, closeModal, confirmDialog, withButton, parseDate, todayStr, addDays } = FGC;
  const STANDARD = ['جهاز صدمات القلب (Defibrillator)', 'مراقبة المريض (Patient Monitor)', 'تخطيط القلب (ECG Machine)', 'مضخة محاليل (Infusion Pump)', 'مضخة حقن (Syringe Pump)',
    'جهاز تنفس صناعي (Ventilator)', 'جهاز تخدير (Anesthesia Machine)', 'حضانة أطفال (Incubator)', 'كي جراحي (Electrosurgical Unit)', 'جهاز شفط سوائل (Suction Pump)',
    'جهاز طرد مركزي (Centrifuge)', 'جهاز ضغط الدم (BP Monitor)', 'مقياس نسبة الأكسجين (Pulse Oximeter)', 'ميزان طبي (Weighing Scale)', 'جهاز تعقيم / أوتوكلاف (Autoclave)'];
  const F = id => document.getElementById(id);
  let ctx, siteId, siteName = '', devices = [], customTypes = [], alertFilter = 'all';

  FGC.init({ site: true, tab: 'calibration', nav: 'site' }).then(c => {
    ctx = c; siteId = c.siteId;
    FGC.$$('[data-edit]').forEach(e => e.hidden = !ctx.can.edit);
    FGC.$$('[data-admin]').forEach(e => e.hidden = !ctx.can.admin);
    F('printDate').textContent = todayStr();
    db.collection('budgets').doc(siteId).onSnapshot(d => {
      if (!d.exists) return;
      siteName = d.data().itemName || '';
      FGC.$$('.js-site-name').forEach(e => e.textContent = siteName);
      document.title = `${siteName} — المعايرة`;
      F('crumb').innerHTML = ctx.can.admin ? `<a href="dashboard.html">لوحة التحكم</a>` : '';
    });
    db.collection('calibration_device_names').onSnapshot(s => { customTypes = s.docs.map(d => d.data().name).filter(Boolean); }, () => {});
    db.collection('calibrations').where('siteId', '==', siteId).onSnapshot(s => {
      devices = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, e => toast(FGC.errMsg(e), 'error'));
  });

  ['fSearch', 'fStatus'].forEach(id => F(id).addEventListener('input', render));

  function state(d) {
    if (d.status === 'inactive') return { key: 'inactive', days: null };
    const exp = parseDate(d.expiryDate), t = parseDate(todayStr());
    if (!exp) return { key: 'danger', days: null };
    const days = Math.round((exp - t) / 86400000);
    return { key: days <= 0 ? 'danger' : days <= 30 ? 'warning' : 'safe', days };
  }
  const BADGE = {
    safe: '<span class="badge badge-success"><span class="dot"></span>سارية</span>',
    warning: '<span class="badge badge-warning"><span class="dot"></span>تنتهي قريباً</span>',
    danger: '<span class="badge badge-danger"><span class="dot"></span>منتهية</span>',
    inactive: '<span class="badge badge-neutral">خارج الخدمة</span>'
  };

  function filtered() {
    const q = F('fSearch').value.trim().toLowerCase(), st = F('fStatus').value;
    return devices.map(d => ({ ...d, _s: state(d) })).filter(d =>
      (st === 'all' || (d.status || 'active') === st) &&
      (alertFilter === 'all' || d._s.key === alertFilter) &&
      (!q || [d.deviceName, d.serialNumber, d.brand, d.location].some(v => String(v || '').toLowerCase().includes(q))))
      .sort((a, b) => String(a.expiryDate).localeCompare(String(b.expiryDate)));
  }

  function render() {
    const counts = { safe: 0, warning: 0, danger: 0, inactive: 0 };
    devices.forEach(d => counts[state(d).key]++);
    const k = (key, label, icon, cls, n) => `<button class="kpi ${cls} ${alertFilter === key ? 'is-active' : ''}" data-filter="${key}"><div class="kpi__label"><span class="kpi__icon"><i class="fa-solid ${icon}"></i></span>${label}</div><div class="kpi__value">${n}</div></button>`;
    F('kpis').innerHTML = k('all', 'إجمالي الأجهزة', 'fa-microscope', '', devices.length) +
      k('safe', 'معايرة سارية', 'fa-circle-check', 'kpi--success', counts.safe) +
      k('warning', 'تنتهي خلال 30 يوم', 'fa-clock', 'kpi--warning', counts.warning) +
      k('danger', 'معايرة منتهية', 'fa-circle-exclamation', 'kpi--danger', counts.danger);

    const list = filtered();
    F('rows').innerHTML = list.map(d => {
      const s = d._s;
      return `<tr class="${s.key === 'danger' ? 'row-danger' : s.key === 'warning' ? 'row-warning' : ''}">
        <td class="cell-title">${esc(d.deviceName)}</td><td>${esc(d.brand || '—')}</td><td class="mono text-brand fw-600">${esc(d.serialNumber)}</td>
        <td>${esc(d.location || '—')}</td><td>${esc(d.calibrationDate || '—')}</td><td class="fw-600">${esc(d.expiryDate || '—')}</td>
        <td class="center fw-600 ${s.key === 'danger' ? 'text-danger' : s.key === 'warning' ? 'text-warning' : ''}">${s.days === null ? '—' : s.days}</td>
        <td>${BADGE[s.key]}</td><td class="small wrap">${esc(d.notes || '—')}</td>
        ${ctx.can.edit ? `<td class="actions-cell"><button class="btn btn-ghost btn-icon" data-act="edit" data-id="${esc(d.id)}"><i class="fa-regular fa-pen-to-square"></i></button><button class="btn btn-ghost btn-icon text-danger" data-act="del" data-id="${esc(d.id)}"><i class="fa-regular fa-trash-can"></i></button></td>` : ''}
      </tr>`;
    }).join('') || `<tr><td colspan="10"><div class="empty"><i class="fa-solid fa-microscope"></i><h4>${devices.length ? 'لا توجد نتائج مطابقة' : 'لا توجد أجهزة مسجلة'}</h4></div></td></tr>`;
  }

  F('kpis').addEventListener('click', e => { const b = e.target.closest('[data-filter]'); if (b) { alertFilter = b.dataset.filter; render(); } });
  F('rows').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'edit') openDevice(b.dataset.id);
    if (b.dataset.act === 'del') {
      const d = devices.find(x => x.id === b.dataset.id);
      if (!(await confirmDialog(`حذف الجهاز ${d ? d.deviceName + ' (' + d.serialNumber + ')' : ''} نهائياً؟`, { title: 'حذف جهاز', confirmText: 'حذف', danger: true }))) return;
      try { await db.collection('calibrations').doc(b.dataset.id).delete(); toast('تم الحذف'); } catch (err) { toast(FGC.errMsg(err), 'error'); }
    }
  });

  function fillTypes(value) {
    const all = [...new Set([...STANDARD, ...customTypes])];
    if (value && !all.includes(value)) all.unshift(value);
    F('dName').innerHTML = '<option value="">— اختر الجهاز —</option>' + all.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    F('dName').value = value || '';
  }
  function openDevice(id) {
    const d = devices.find(x => x.id === id) || {};
    F('devTitle').textContent = id ? 'تعديل بيانات الجهاز' : 'إضافة جهاز قياس';
    F('dId').value = id || ''; fillTypes(d.deviceName);
    F('dBrand').value = d.brand || ''; F('dSN').value = d.serialNumber || ''; F('dLoc').value = d.location || '';
    F('dCal').value = d.calibrationDate || ''; F('dExp').value = d.expiryDate || ''; F('dStatus').value = d.status || 'active'; F('dNotes').value = d.notes || '';
    F('snWarn').hidden = true;
    openModal('devModal');
  }
  F('dCal').addEventListener('change', () => { const d = parseDate(F('dCal').value); if (d) { d.setFullYear(d.getFullYear() + 1); d.setDate(d.getDate() - 1); F('dExp').value = FGC.toISODate(d); } });
  F('dSN').addEventListener('input', () => {
    const sn = F('dSN').value.trim().toLowerCase();
    F('snWarn').hidden = !sn || !devices.some(d => d.id !== F('dId').value && String(d.serialNumber || '').trim().toLowerCase() === sn);
  });

  async function addType() {
    const name = await FGC.promptDialog('إضافة نوع جهاز', { label: 'اسم الجهاز', placeholder: 'مثال: جهاز أشعة مقطعية (CT Scanner)', confirmText: 'إضافة' });
    if (!name) return;
    try {
      await db.collection('calibration_device_names').add({ name, createdAt: new Date().toISOString() });
      customTypes.push(name); fillTypes(name); toast('تمت إضافة النوع');
    } catch (e) { toast(FGC.errMsg(e), 'error'); }
  }

  function saveDevice(btn) {
    const id = F('dId').value;
    const data = { siteId, deviceName: F('dName').value, brand: F('dBrand').value.trim(), serialNumber: F('dSN').value.trim(), location: F('dLoc').value.trim(),
      calibrationDate: F('dCal').value, expiryDate: F('dExp').value, status: F('dStatus').value, notes: F('dNotes').value.trim() };
    if (!data.deviceName || !data.brand || !data.serialNumber || !data.calibrationDate || !data.expiryDate) return toast('يرجى تعبئة الحقول المطلوبة (*)', 'warning');
    if (data.expiryDate < data.calibrationDate) return toast('تاريخ الانتهاء قبل تاريخ المعايرة.', 'warning');
    withButton(btn, async () => {
      if (id) await db.collection('calibrations').doc(id).update(data);
      else { data.createdAt = new Date().toISOString(); await db.collection('calibrations').add(data); }
      closeModal('devModal'); toast('تم الحفظ');
    });
  }

  function exportCSV() {
    const L = { safe: 'سارية', warning: 'تنتهي قريباً', danger: 'منتهية', inactive: 'خارج الخدمة' };
    FGC.downloadCSV(`معايرة_${siteName}_${todayStr()}.csv`, ['الجهاز', 'الشركة', 'الرقم التسلسلي', 'القسم', 'آخر معايرة', 'انتهاء المعايرة', 'الأيام المتبقية', 'الحالة', 'ملاحظات'],
      filtered().map(d => [d.deviceName, d.brand, d.serialNumber, d.location, d.calibrationDate, d.expiryDate, d._s.days ?? '', L[d._s.key], d.notes]));
  }
</script>
</body>
</html>
