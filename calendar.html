<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الخط الزمني للإجازات — FGC System</title>
  <link rel="icon" href="FGC.jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/core.js"></script>
</head>
<body>
<div id="pageLoader" class="page-loader"><div class="spinner"></div></div>
<header id="appHeader"></header>

<main class="page">
  <div class="page-head">
    <div><div class="breadcrumb no-print"><a href="vacations.html">الإجازات المركزية</a><i class="fa-solid fa-chevron-left" style="font-size:10px"></i><span>الخط الزمني</span></div>
      <h1>الخط الزمني للإجازات</h1><p>عرض شهري لكل الإجازات مع تمييز التعارضات</p></div>
    <div class="actions">
      <button class="btn btn-secondary btn-icon" onclick="shift(-1)" title="الشهر السابق"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="btn btn-secondary" onclick="goToday()">اليوم</button>
      <button class="btn btn-secondary btn-icon" onclick="shift(1)" title="الشهر التالي"><i class="fa-solid fa-chevron-left"></i></button>
      <h2 id="monthTitle" style="min-width:150px;text-align:center;font-size:20px"></h2>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="field"><label>الموقع</label><select class="select" id="fSite"><option value="all">كل المواقع</option></select></div>
      <div class="field"><label>الوظيفة</label>
        <div class="dropdown"><button type="button" class="btn btn-secondary dropdown__btn" onclick="this.parentNode.classList.toggle('is-open')"><span id="jobLabel">كل الوظائف</span><i class="fa-solid fa-chevron-down small"></i></button><div class="dropdown__menu" id="jobMenu"></div></div>
      </div>
      <div class="field" style="flex:0 1 150px"><label>الشهر</label><select class="select" id="fMonth"></select></div>
      <div class="field" style="flex:0 1 110px"><label>السنة</label><select class="select" id="fYear"></select></div>
      <div class="field" style="flex:2 1 300px;justify-content:flex-end"><div class="legend">
        <span><i class="bar-approved"></i>معتمد</span><span><i class="bar-pending"></i>قيد المراجعة</span><span><i class="bar-suggested"></i>موعد مقترح</span><span><i class="bar-conflict"></i>تعارض بالبديل</span>
      </div></div>
    </div>
    <div class="gantt-scroll"><table class="gantt"><thead id="ghead"></thead><tbody id="gbody"></tbody></table></div>
  </div>
</main>

<script>
  const { db, esc, pad, toISODate } = FGC;
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const DAYS = ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  let vacs = [], sites = new Map(), conflicts = new Set();
  const now = new Date();
  let year = now.getFullYear(), month = now.getMonth();

  const fM = document.getElementById('fMonth'), fY = document.getElementById('fYear');
  fM.innerHTML = MONTHS.map((m, i) => `<option value="${i}">${m}</option>`).join('');
  function fillYears() {
    const ys = new Set([year - 1, year, year + 1, now.getFullYear()]);
    vacs.forEach(v => { const y = parseInt(v.startDate); if (y) ys.add(y); });
    fY.innerHTML = [...ys].sort().map(y => `<option value="${y}">${y}</option>`).join('');
    fY.value = year;
  }
  fM.addEventListener('change', () => { month = +fM.value; draw(); });
  fY.addEventListener('change', () => { year = +fY.value; draw(); });
  document.getElementById('fSite').addEventListener('change', draw);
  document.getElementById('jobMenu').addEventListener('change', () => {
    const n = FGC.$$('.job-cb:checked').length;
    document.getElementById('jobLabel').textContent = n ? `${n} وظيفة محددة` : 'كل الوظائف';
    draw();
  });
  function shift(d) { month += d; if (month < 0) { month = 11; year--; } if (month > 11) { month = 0; year++; } fillYears(); draw(); }
  function goToday() { year = now.getFullYear(); month = now.getMonth(); fillYears(); draw(); }

  FGC.init({ admin: true, nav: 'calendar' }).then(() => {
    fillYears();
    db.collection('budgets').onSnapshot(s => {
      sites = new Map(s.docs.map(d => [d.id, d.data().itemName]));
      const sel = document.getElementById('fSite'), cur = sel.value;
      sel.innerHTML = '<option value="all">كل المواقع</option>' + [...sites].sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'ar')).map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
      sel.value = sites.has(cur) ? cur : 'all';
      draw();
    });
    db.collection('vacations').onSnapshot(s => {
      vacs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(v => v.startDate && v.endDate);
      const checked = FGC.$$('.job-cb:checked').map(c => c.value);
      const jobs = [...new Set(vacs.map(v => v.jobTitle).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));
      document.getElementById('jobMenu').innerHTML = jobs.map(j => `<label class="check"><input type="checkbox" class="job-cb" value="${esc(j)}" ${checked.includes(j) ? 'checked' : ''}> ${esc(j)}</label>`).join('');
      conflicts = new Set();
      const act = vacs.filter(v => v.status !== 'rejected' && v.status !== 'suggested' && v.coverEmp && v.coverEmp.trim());
      for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++)
        if (act[i].coverEmp === act[j].coverEmp && act[i].startDate <= act[j].endDate && act[i].endDate >= act[j].startDate) { conflicts.add(act[i].id); conflicts.add(act[j].id); }
      fillYears(); draw();
    }, err => FGC.toast(FGC.errMsg(err), 'error'));
  });

  function draw() {
    fM.value = month; fY.value = year;
    document.getElementById('monthTitle').textContent = `${MONTHS[month]} ${year}`;
    const days = new Date(year, month + 1, 0).getDate();
    const mStart = `${year}-${pad(month + 1)}-01`, mEnd = `${year}-${pad(month + 1)}-${pad(days)}`;
    const today = toISODate(new Date());
    const cls = d => { const dt = new Date(year, month, d); const s = toISODate(dt); return (dt.getDay() === 5 || dt.getDay() === 6 ? ' weekend' : '') + (s === today ? ' today' : ''); };

    let head = '<tr><th class="emp">الموظف</th>';
    for (let d = 1; d <= days; d++) head += `<th class="day${cls(d)}"><small>${DAYS[new Date(year, month, d).getDay()]}</small>${d}</th>`;
    document.getElementById('ghead').innerHTML = head + '</tr>';

    const site = document.getElementById('fSite').value;
    const jobs = FGC.$$('.job-cb:checked').map(c => c.value);
    const list = vacs.filter(v => v.status !== 'rejected' && v.startDate <= mEnd && v.endDate >= mStart &&
      (site === 'all' || v.siteId === site) && (!jobs.length || jobs.includes(v.jobTitle)))
      .sort((a, b) => String(sites.get(a.siteId) || '').localeCompare(String(sites.get(b.siteId) || ''), 'ar') || String(a.empName).localeCompare(String(b.empName), 'ar'));

    if (!list.length) {
      document.getElementById('gbody').innerHTML = `<tr><td colspan="${days + 1}" style="height:auto"><div class="empty"><i class="fa-solid fa-mug-hot"></i><h4>لا توجد إجازات في هذا الشهر</h4><p>جرّب شهراً آخر أو غيّر الفلاتر.</p></div></td></tr>`;
      return;
    }
    document.getElementById('gbody').innerHTML = list.map(v => {
      const color = conflicts.has(v.id) ? 'bar-conflict' : v.status === 'approved' ? 'bar-approved' : v.status === 'suggested' ? 'bar-suggested' : 'bar-pending';
      const tip = esc(`${v.empName}\n${v.startDate} ← ${v.endDate}\nالبديل: ${v.coverEmp || 'غير محدد'}`);
      let row = `<tr><td class="emp"><div class="cell-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(v.empName)}</div><div class="cell-sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(v.jobTitle || '—')} · ${esc(sites.get(v.siteId) || '')}</div></td>`;
      for (let d = 1; d <= days; d++) {
        const s = `${year}-${pad(month + 1)}-${pad(d)}`;
        let inner = '';
        if (s >= v.startDate && s <= v.endDate) {
          const st = s === v.startDate || d === 1, en = s === v.endDate || d === days;
          const shape = st && en ? 'single' : st ? 'start' : en ? 'end' : '';
          inner = `<div class="bar ${color} ${shape}" title="${tip}">${st ? (conflicts.has(v.id) ? '<i class="fa-solid fa-bolt"></i>' : '') : ''}</div>`;
        }
        row += `<td class="day${cls(d)}">${inner}</td>`;
      }
      return row + '</tr>';
    }).join('');
  }
</script>
</body>
</html>
