<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقرير العقد — FGC System</title>
  <link rel="icon" href="FGC.jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/core.js"></script>
</head>
<body>
<div id="pageLoader" class="page-loader"><div class="spinner"></div></div>
<header id="appHeader"></header>

<main class="page">
  <div class="print-only print-head"><img src="FGC.jpeg" alt=""><h2>تقرير تحليل عقد</h2><div id="printName"></div></div>

  <div class="page-head">
    <div>
      <div class="breadcrumb no-print"><a href="dashboard.html">لوحة التحكم</a><i class="fa-solid fa-chevron-left" style="font-size:10px"></i><span>تقرير العقد</span></div>
      <h1 id="title">...</h1>
      <p id="meta"></p>
    </div>
    <div class="actions"><button class="btn btn-secondary" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة التقرير</button></div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="kpi__label"><span class="kpi__icon"><i class="fa-solid fa-wallet"></i></span>قيمة العقد</div><div class="kpi__value" id="kBudget">—</div></div>
    <div class="kpi kpi--danger"><div class="kpi__label"><span class="kpi__icon"><i class="fa-solid fa-arrow-trend-down"></i></span>إجمالي المصروف</div><div class="kpi__value" id="kSpent">—</div></div>
    <div class="kpi kpi--success"><div class="kpi__label"><span class="kpi__icon"><i class="fa-solid fa-scale-balanced"></i></span>المتبقي</div><div class="kpi__value" id="kBal">—</div></div>
    <div class="kpi kpi--accent"><div class="kpi__label"><span class="kpi__icon"><i class="fa-solid fa-coins"></i></span>إجمالي التمويل</div><div class="kpi__value" id="kProfit">—</div></div>
  </div>

  <div class="form-grid" style="margin-bottom:20px">
    <div class="card"><div class="card-head"><h3>نسبة الصرف</h3></div><div class="card-body" style="height:280px"><canvas id="c1"></canvas></div></div>
    <div class="card"><div class="card-head"><h3>توزيع الميزانية حسب نوع البند</h3></div><div class="card-body" style="height:280px"><canvas id="c2"></canvas></div></div>
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-list-check text-brand"></i> المواقع والبنود</h3></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>الموقع / المشروع</th><th>النوع</th><th class="num">الميزانية</th><th class="num">المصروف</th><th class="num">المتبقي</th><th>نسبة الصرف</th><th>الحالة</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</main>

<script>
  const { db, esc, fmt, num, catBadge, CATEGORIES } = FGC;
  const contractId = FGC.param('id');

  FGC.init({ admin: true, nav: 'dashboard' }).then(async () => {
    if (!contractId) return location.replace('dashboard.html');
    try {
      const [cDoc, sSnap] = await Promise.all([
        db.collection('contracts').doc(contractId).get(),
        db.collection('budgets').where('contractId', '==', contractId).get()
      ]);
      if (!cDoc.exists) { document.getElementById('title').textContent = 'العقد غير موجود'; return; }
      render(cDoc.data(), sSnap.docs.map(d => ({ id: d.id, ...d.data() })));
    } catch (e) { FGC.toast(FGC.errMsg(e), 'error'); }
  });

  function render(c, sites) {
    document.title = `${c.name} — تقرير العقد`;
    document.getElementById('title').textContent = c.name;
    document.getElementById('printName').textContent = c.name;
    const meta = [];
    if (c.supervisingAuthority) meta.push(`<i class="fa-solid fa-building-columns"></i> ${esc(c.supervisingAuthority)}`);
    if (c.startDate || c.endDate) meta.push(`<i class="fa-regular fa-calendar"></i> ${esc(c.startDate || '؟')} ← ${esc(c.endDate || '؟')}`);
    document.getElementById('meta').innerHTML = meta.join(' &nbsp;·&nbsp; ');

    let tb = 0, ts = 0, tp = 0; const byCat = { spare_parts: 0, labor: 0, subcontractors: 0 };
    sites.sort((a, b) => String(a.itemName).localeCompare(String(b.itemName), 'ar'));
    document.getElementById('rows').innerHTML = sites.map(s => {
      const b = num(s.totalAllocatedAmount), sp = num(s.totalSpent);
      tb += b; ts += sp; tp += num(s.totalProfit);
      const cat = CATEGORIES[s.category] ? s.category : 'spare_parts'; byCat[cat] += b;
      const p = b ? sp / b * 100 : 0;
      return `<tr>
        <td><a class="cell-title" href="details_finance.html?id=${encodeURIComponent(s.id)}">${esc(s.itemName)}</a></td>
        <td>${catBadge(cat)}</td>
        <td class="num">${fmt(b)}</td><td class="num text-danger">${fmt(sp)}</td><td class="num fw-600">${fmt(b - sp)}</td>
        <td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="progress ${p > 90 ? 'is-danger' : p > 75 ? 'is-warning' : ''}" style="flex:1"><span style="width:${Math.min(p, 100)}%"></span></div><span class="small muted">${p.toFixed(1)}%</span></div></td>
        <td>${p > 90 ? '<span class="badge badge-danger">حرجة</span>' : p > 75 ? '<span class="badge badge-warning">مرتفعة</span>' : '<span class="badge badge-success">جيدة</span>'}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="7"><div class="empty"><h4>لا توجد بنود لهذا العقد</h4></div></td></tr>`;

    document.getElementById('kBudget').textContent = fmt(tb);
    document.getElementById('kSpent').textContent = fmt(ts);
    document.getElementById('kBal').textContent = fmt(tb - ts);
    document.getElementById('kProfit').textContent = fmt(tp);

    if (window.Chart) {
      Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
      new Chart(document.getElementById('c1'), { type: 'doughnut',
        data: { labels: ['المصروف', 'المتبقي'], datasets: [{ data: [ts, Math.max(0, tb - ts)], backgroundColor: ['#f04438', '#12b76a'], borderWidth: 0 }] },
        options: { maintainAspectRatio: false, cutout: '68%', plugins: { legend: { position: 'bottom' } } } });
      new Chart(document.getElementById('c2'), { type: 'bar',
        data: { labels: Object.keys(byCat).map(k => CATEGORIES[k].label), datasets: [{ label: 'الميزانية', data: Object.values(byCat), backgroundColor: ['#1a3c6d', '#b8912a', '#98a2b3'], borderRadius: 6 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } });
    }
  }
</script>
</body>
</html>
